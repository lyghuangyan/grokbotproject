  <text x="520" y="200" font-family="system-ui, sans-serif" font-size="13" fill="#71717a">删除</text>
  <rect x="40" y="220" width="520" height="1" fill="#e4e4e7"/>
  <circle cx="60" cy="255" r="9" fill="#18181b"/>
  <path d="M55 255 l4 4 6 -6" stroke="#fafafa" stroke-width="1.5" fill="none"/>
  <text x="85" y="260" font-family="system-ui, sans-serif" font-size="14" fill="#71717a" text-decoration="line-through">写周报</text>
  <text x="520" y="260" font-family="system-ui, sans-serif" font-size="13" fill="#71717a">删除</text>
  <rect x="40" y="280" width="520" height="1" fill="#e4e4e7"/>
  <circle cx="60" cy="315" r="9" fill="none" stroke="#18181b" stroke-width="2"/>
  <text x="85" y="320" font-family="system-ui, sans-serif" font-size="14" fill="#09090b">准备会议材料</text>
  <text x="520" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#71717a">删除</text>
  <text x="300" y="640" font-family="system-ui, sans-serif" font-size="12" fill="#71717a" text-anchor="middle">数据仅保存在当前浏览器本地，清除浏览器数据后会丢失。</text>
