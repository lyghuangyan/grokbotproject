  <rect x="40" y="100" width="400" height="40" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="52" y="125" font-family="system-ui, sans-serif" font-size="14" fill="#71717a">添加一项待办…</text>
  <rect x="450" y="100" width="110" height="40" rx="8" fill="#18181b"/>
  <text x="478" y="125" font-family="system-ui, sans-serif" font-size="14" fill="#fafafa">添加</text>
  <rect x="40" y="160" width="520" height="1" fill="#e4e4e7"/>
  <circle cx="60" cy="195" r="9" fill="none" stroke="#18181b" stroke-width="2"/>
